        body { margin: 0; padding: 0; }

        }
        /* Texto normal de la leyenda */
        div p {
            color: black;
            font-size: 14px;
        }

        .map-overlay {
            position: absolute;
            /* Ubicación: si quieres arriba, a la izquierda, tendrás que cambiar bottom por top y right por left */
            top: 0;
            left: 0;
            /* Color de fondo de la leyenda */
            background: rgba(255, 255, 255, 0.8);
            /* Espacio reservado con respecto al límite de pantalla */
            margin-right: 20px;
            /* Fuente tipográfica */
            font-family: Arial, sans-serif;
            overflow: auto;
            /* Borde de la caja de la leyenda */
            border-radius: 0px;
        }
        /* Estilos propios del contenido de la leyenda */

<body>
    <!-- Carga del geocoder de MapLibre -->
    <script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
    <link
    rel="stylesheet"
    href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css"
    />

    <!-- Contenedor del mapa-->
    <div id='map'></div>
        <div class='map-overlay' id='legend'></div>

    <!-- Java Script de MapLibre-->
    <script>
        const map = new maplibregl.Map({
        // Aquí pegar el Raw Alejandro del ESTILO de mi mapa
          style: 'https://raw.githubusercontent.com/encarnihinojosa/mapstyles/refs/heads/main/positron_light.json',
          center: [-4.4360840738650955, 36.71303986382696],
          zoom: 13.3,
          container: 'map',
        });
    
map.on('load', () => {

map.addSource('metrolinea1', {
// es de tipo geojson
'type': 'geojson',
// Aquí pegar el Raw Alejandro de los DATOS de mi mapa
'data': 'https://raw.githubusercontent.com/galeh2004/metromalaga/refs/heads/main/map%20(2).geojson'
});

map.addLayer({
    'id': 'metro1_layer',
    'type': 'line',
    'source': 'metrolinea1',
    'paint': {
        'line-color': '#E2001A50',
        'line-width': 5
    }
});

map.addSource('metrolinea2', {
// es de tipo geojson
'type': 'geojson',
// Aquí pegar el Raw Alejandro de los DATOS de mi mapa
'data': 'https://raw.githubusercontent.com/galeh2004/metromalaga/refs/heads/main/map%20(1).geojson'
});

map.addLayer({
    'id': 'metro2_layer',
    'type': 'line',
    'source': 'metrolinea2',
    'paint': {
        'line-color': '#0072BA50',
        'line-width': 5
    }
});

map.addSource('puntos', {
// es de tipo geojson
'type': 'geojson',
// Aquí pegar el Raw Alejandro de los DATOS de mi mapa
'data': 'https://raw.githubusercontent.com/galeh2004/metromalaga/refs/heads/main/malagasubterraneafinal%20(1).json'
});

map.addLayer({
    'id': 'puntos_layer',
    'type': 'circle',
    'source': 'puntos',
    'paint': {
        'circle-radius': 6,
        'circle-color': '#202020',
        'circle-stroke-color': '#ffffff',
        'circle-stroke-width': 8,
        'circle-stroke-opacity': 0
    }
});

});




let popup; // Variable para almacenar la referencia al popup

map.on('mousemove', 'puntos_layer', (e) => {
    // Crea un nuevo popup si no existe
    if (!popup) {
        popup = new maplibregl.Popup({ 
            offset: [0, -20],
            closeButton: false,
            closeOnClick: false
        });
    }
    

popup
  .setLngLat(e.lngLat)
  .setHTML(`
  <p><b>${e.features[0].properties.descubrimiento}</b></p>
  <p style="color:grey;">${e.features[0].properties.fecha}</p>
            <p>${e.features[0].properties.name}</p>
  `)
  .addTo(map);

map.getCanvas().style.cursor = 'pointer';
});



// Cambiar el cursor a normal y eliminar el popup cuando el mouse sale del polígono
map.on('mouseleave', 'puntos_layer', () => {
    map.getCanvas().style.cursor = '';
    if (popup) {
        popup.remove(); // Elimina el popup del mapa
        popup = null;   // Restablece la referencia
    }
});
